name: Cross-Browser Validation

on:
  workflow_dispatch:
    inputs:
      browser:
        description: Browser engine to validate
        required: true
        default: firefox
        type: choice
        options:
          - firefox
          - webkit

concurrency:
  group: external-cross-browser-validation
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  cross-browser:
    name: E2E - ${{ inputs.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps ${{ inputs.browser }}

      - name: Run cross-browser validation
        run: npx playwright test --project=${{ inputs.browser }} --workers=1

      - name: Upload Playwright HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ inputs.browser }}
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload failure evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ inputs.browser }}
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore
